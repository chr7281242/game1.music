<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chiharu Ota - Rhythm Game</title>
    <style>
        :root {
            --bg-color: #0b1018; /* より深い紺色 */
            --lane-color: #0d1a26;
            --line-color: #1b2d3d;
            /* ノーツの色：白っぽい水色 */
            --note-color: #e0f7fa; 
            --note-glow: #00d4ff;
            --highlight: #00fff2;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--lane-color);
            border-left: 1px solid var(--line-color);
            border-right: 1px solid var(--line-color);
            overflow: hidden;
        }

        /* 判定ライン */
        #judge-line {
            position: absolute;
            bottom: 80px;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px var(--highlight);
            z-index: 10;
        }

        /* レーンの区切り */
        .lane-border {
            position: absolute;
            top: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--line-color));
            z-index: 1;
        }

        /* ノーツのデザイン変更 */
        .note {
            position: absolute;
            width: 25%;
            height: 15px;
            background: var(--note-color);
            border-radius: 2px;
            /* 白っぽい水色の発光エフェクト */
            box-shadow: 0 0 12px var(--note-glow), 0 0 4px #fff;
            z-index: 5;
        }

        /* UI表示 */
        #ui {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        #score { font-size: 20px; font-weight: 200; letter-spacing: 2px; }
        #combo { font-size: 28px; font-weight: bold; color: var(--note-glow); margin-top: 5px; }
        #message { font-style: italic; font-weight: bold; margin-top: 10px; }

        /* タップエフェクト */
        .tap-zone {
            position: absolute;
            bottom: 0;
            width: 25%;
            height: 120px;
            background: transparent;
            z-index: 20;
        }
        .tap-zone:active {
            background: linear-gradient(to top, rgba(0, 212, 255, 0.4), transparent);
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 16, 24, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        button {
            padding: 12px 40px;
            font-size: 18px;
            background: transparent;
            color: var(--note-glow);
            border: 1px solid var(--note-glow);
            border-radius: 2px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
        }
        button:hover {
            background: var(--note-glow);
            color: #fff;
            box-shadow: 0 0 20px var(--note-glow);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score">SCORE: 00000</div>
        <div id="combo">0</div>
        <div id="message"></div>
    </div>

    <div id="judge-line"></div>
    
    <div class="lane-border" style="left: 25%;"></div>
    <div class="lane-border" style="left: 50%;"></div>
    <div class="lane-border" style="left: 75%;"></div>

    <div class="tap-zone" style="left: 0%;" onmousedown="judge(0)" ontouchstart="judge(0)"></div>
    <div class="tap-zone" style="left: 25%;" onmousedown="judge(1)" ontouchstart="judge(1)"></div>
    <div class="tap-zone" style="left: 50%;" onmousedown="judge(2)" ontouchstart="judge(2)"></div>
    <div class="tap-zone" style="left: 75%;" onmousedown="judge(3)" ontouchstart="judge(3)"></div>

    <div id="start-screen">
        <h1 style="font-weight: 200; letter-spacing: 5px;">AQUA RHYTHM</h1>
        <p style="font-size: 12px; color: #5c7080; margin-bottom: 30px;">D / F / J / K</p>
        <button onclick="startGame()">START</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const scoreElement = document.getElementById('score');
    const comboElement = document.getElementById('combo');
    const messageElement = document.getElementById('message');
    const startScreen = document.getElementById('start-screen');

    let score = 0;
    let combo = 0;
    let notes = [];
    let gameActive = false;
    const laneKeys = ['d', 'f', 'j', 'k'];
    const judgeY = window.innerHeight - 80;

    function startGame() {
        startScreen.style.display = 'none';
        score = 0;
        combo = 0;
        gameActive = true;
        updateUI();
        spawnNotes();
        requestAnimationFrame(update);
    }

    function spawnNotes() {
        if (!gameActive) return;
        const lane = Math.floor(Math.random() * 4);
        createNoteElement(lane);
        // 徐々に難易度を上げるための調整
        let interval = Math.max(250, 600 - (score / 100));
        setTimeout(spawnNotes, interval + Math.random() * 300);
    }

    function createNoteElement(lane) {
        const note = document.createElement('div');
        note.className = 'note';
        note.style.left = (lane * 25) + '%';
        note.style.top = '-20px';
        container.appendChild(note);
        
        notes.push({ el: note, lane: lane, y: -20, hit: false });
    }

    function update() {
        if (!gameActive) return;

        for (let i = notes.length - 1; i >= 0; i--) {
            const n = notes[i];
            n.y += 6; // 少しだけスピードアップ
            n.el.style.top = n.y + 'px';

            if (n.y > window.innerHeight) {
                if (!n.hit) {
                    combo = 0;
                    showMessage("MISS", "#5c7080");
                }
                container.removeChild(n.el);
                notes.splice(i, 1);
                updateUI();
            }
        }
        requestAnimationFrame(update);
    }

    function judge(lane) {
        if (!gameActive) return;
        const targetNote = notes.find(n => n.lane === lane && !n.hit && Math.abs(n.y - judgeY + 80) < 70);

        if (targetNote) {
            const diff = Math.abs(targetNote.y - judgeY + 80);
            targetNote.hit = true;
            targetNote.el.style.display = 'none';

            if (diff < 25) {
                score += 100;
                combo++;
                showMessage("PERFECT", "#fff");
            } else {
                score += 50;
                combo++;
                showMessage("GREAT", "#00d4ff");
            }
        }
        updateUI();
    }

    function showMessage(txt, color) {
        messageElement.innerText = txt;
        messageElement.style.color = color;
        // メッセージが重ならないようにクリア
        setTimeout(() => { if(messageElement.innerText === txt) messageElement.innerText = ""; }, 400);
    }

    function updateUI() {
        scoreElement.innerText = `SCORE: ${score.toString().padStart(5, '0')}`;
        comboElement.innerText = combo > 0 ? combo : "";
    }

    window.addEventListener('keydown', (e) => {
        const keyIndex = laneKeys.indexOf(e.key.toLowerCase());
        if (keyIndex !== -1) judge(keyIndex);
    });
</script>

</body>
</html>
