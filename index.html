<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aqua Rhythm - Difficulty Select</title>
    <style>
        :root {
            --bg-color: #0b1018;
            --lane-color: #0d1a26;
            --line-color: #1b2d3d;
            --note-color: #e0f7fa; 
            --note-glow: #00d4ff;
            --highlight: #00fff2;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: white;
            font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative; width: 100%; max-width: 400px; height: 100%;
            background: var(--lane-color); border-left: 1px solid var(--line-color);
            border-right: 1px solid var(--line-color); overflow: hidden;
        }

        /* UI */
        #ui {
            position: absolute; top: 40px; width: 100%; text-align: center;
            pointer-events: none; z-index: 100;
        }
        #timer { font-size: 14px; color: #5c7080; margin-bottom: 5px; }
        #score { font-size: 20px; font-weight: 200; letter-spacing: 2px; }
        #combo { font-size: 32px; font-weight: bold; color: var(--note-glow); height: 40px; }
        #message { font-style: italic; font-weight: bold; height: 20px; }

        #judge-line {
            position: absolute; bottom: 80px; width: 100%; height: 3px;
            background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 15px var(--highlight); z-index: 50;
        }

        .lane-border {
            position: absolute; top: 0; width: 1px; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--line-color)); z-index: 1;
        }

        .note, .long-note {
            position: absolute; width: 25%; background: var(--note-color);
            border-radius: 2px; box-shadow: 0 0 12px var(--note-glow), 0 0 4px #fff; z-index: 10;
        }
        .long-note { background: linear-gradient(to bottom, var(--note-color), rgba(0, 212, 255, 0.4)); }

        .tap-zone { position: absolute; bottom: 0; width: 25%; height: 120px; z-index: 60; }
        .tap-zone.active { background: linear-gradient(to top, rgba(0, 212, 255, 0.4), transparent); }

        /* スクリーン */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 16, 24, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; text-align: center;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button {
            padding: 12px 40px; font-size: 16px; background: transparent;
            color: var(--note-glow); border: 1px solid var(--note-glow);
            border-radius: 2px; cursor: pointer; letter-spacing: 2px; transition: 0.2s;
        }
        button:hover { background: rgba(0, 212, 255, 0.1); box-shadow: 0 0 10px var(--note-glow); }

        #result-screen h2 { font-weight: 200; letter-spacing: 8px; color: var(--highlight); }
        .stat-label { font-size: 11px; color: #5c7080; margin-top: 10px; }
        .stat-value { font-size: 20px; font-weight: bold; }
        #rank { font-size: 64px; text-shadow: 0 0 20px var(--note-glow); margin: 5px 0; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="timer">TIME: 03:00</div>
        <div id="score">SCORE: 00000</div>
        <div id="combo"></div>
        <div id="message"></div>
    </div>

    <div id="judge-line"></div>
    <div class="lane-border" style="left: 25%;"></div>
    <div class="lane-border" style="left: 50%;"></div>
    <div class="lane-border" style="left: 75%;"></div>

    <div id="zone-0" class="tap-zone" style="left: 0%;" onmousedown="handleStart(0)" onmouseup="handleEnd(0)" ontouchstart="handleStart(0)" ontouchend="handleEnd(0)"></div>
    <div id="zone-1" class="tap-zone" style="left: 25%;" onmousedown="handleStart(1)" onmouseup="handleEnd(1)" ontouchstart="handleStart(1)" ontouchend="handleEnd(1)"></div>
    <div id="zone-2" class="tap-zone" style="left: 50%;" onmousedown="handleStart(2)" onmouseup="handleEnd(2)" ontouchstart="handleStart(2)" ontouchend="handleEnd(2)"></div>
    <div id="zone-3" class="tap-zone" style="left: 75%;" onmousedown="handleStart(3)" onmouseup="handleEnd(3)" ontouchstart="handleStart(3)" ontouchend="handleEnd(3)"></div>

    <div id="start-screen" class="overlay">
        <h1 style="font-weight: 200; letter-spacing: 5px; margin-bottom: 5px;">AQUA RHYTHM</h1>
        <p style="font-size: 11px; color: #5c7080; margin-bottom: 20px;">SELECT DIFFICULTY</p>
        <div class="btn-group">
            <button onclick="startGame('EASY')">EASY</button>
            <button onclick="startGame('NORMAL')">NORMAL</button>
            <button onclick="startGame('HARD')">HARD</button>
        </div>
    </div>

    <div id="result-screen" class="overlay" style="display: none;">
        <h2 id="res-diff-name">FINISH</h2>
        <div id="rank">A</div>
        <div class="stat-label">FINAL SCORE</div>
        <div id="final-score" class="stat-value">0</div>
        <div class="stat-label">MAX COMBO</div>
        <div id="max-combo" class="stat-value">0</div>
        <button onclick="location.reload()">BACK TO MENU</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const timerEl = document.getElementById('timer');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const messageEl = document.getElementById('message');

    let score = 0, combo = 0, maxCombo = 0, timeLeft = 180;
    let notes = [], gameActive = false, isPressing = [false, false, false, false];
    let diffSetting = { speed: 6, interval: 600, longProb: 0.1 };
    const laneKeys = ['d', 'f', 'j', 'k'];
    const judgeY = window.innerHeight - 80;

    function startGame(diff) {
        document.getElementById('start-screen').style.display = 'none';
        // 難易度ごとの設定
        if (diff === 'EASY')   diffSetting = { name: 'EASY', speed: 5, interval: 800, longProb: 0.1 };
        if (diff === 'NORMAL') diffSetting = { name: 'NORMAL', speed: 7, interval: 500, longProb: 0.2 };
        if (diff === 'HARD')   diffSetting = { name: 'HARD', speed: 10, interval: 300, longProb: 0.4 };

        gameActive = true;
        updateUI();
        startTimer();
        spawnManager();
        requestAnimationFrame(update);
    }

    function startTimer() {
        const timerInterval = setInterval(() => {
            if (!gameActive) { clearInterval(timerInterval); return; }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            timerEl.innerText = `TIME: ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); }
        }, 1000);
    }

    function spawnManager() {
        if (!gameActive) return;
        const lane = Math.floor(Math.random() * 4);
        const isLong = Math.random() < diffSetting.longProb;
        createNote(lane, isLong, isLong ? 150 + Math.random() * 200 : 15);
        
        let interval = Math.max(100, diffSetting.interval - (score / 300));
        setTimeout(spawnManager, interval + Math.random() * 200);
    }

    function createNote(lane, isLong, length) {
        const note = document.createElement('div');
        note.className = isLong ? 'long-note' : 'note';
        note.style.left = (lane * 25) + '%';
        note.style.height = length + 'px';
        note.style.top = (-length) + 'px';
        container.appendChild(note);
        notes.push({ el: note, lane: lane, y: -length, height: length, isLong: isLong, hit: false, completed: false });
    }

    function update() {
        if (!gameActive) return;
        for (let i = notes.length - 1; i >= 0; i--) {
            const n = notes[i];
            n.y += diffSetting.speed;
            n.el.style.top = n.y + 'px';

            if (n.isLong && isPressing[n.lane] && !n.completed) {
                if (n.y + n.height >= judgeY - 30 && n.y <= judgeY) {
                    score += 2;
                    if (Math.random() > 0.95) { combo++; maxCombo = Math.max(maxCombo, combo); }
                }
            }

            if (n.y > window.innerHeight) {
                if (!n.hit && !n.completed) { combo = 0; showMessage("MISS", "#5c7080"); }
                container.removeChild(n.el);
                notes.splice(i, 1);
                updateUI();
            }
        }
        requestAnimationFrame(update);
    }

    function handleStart(lane) {
        if (!gameActive) return;
        isPressing[lane] = true;
        document.getElementById(`zone-${lane}`).classList.add('active');
        const target = notes.find(n => n.lane === lane && !n.hit && Math.abs((n.y + n.height) - judgeY) < 70);
        if (target) {
            target.hit = true;
            if (!target.isLong) target.el.style.display = 'none';
            score += 100; combo++; maxCombo = Math.max(maxCombo, combo);
            showMessage("PERFECT", "#fff");
        }
        updateUI();
    }

    function handleEnd(lane) {
        isPressing[lane] = false;
        document.getElementById(`zone-${lane}`).classList.remove('active');
        const target = notes.find(n => n.lane === lane && n.isLong && n.hit && !n.completed);
        if (target) {
            target.completed = true;
            target.el.style.opacity = '0.3';
            if (Math.abs(target.y - judgeY) < 60) { score += 100; showMessage("NICE!", "#00fff2"); }
        }
    }

    function endGame() {
        gameActive = false;
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('res-diff-name').innerText = diffSetting.name + " CLEAR";
        document.getElementById('final-score').innerText = score.toLocaleString();
        document.getElementById('max-combo').innerText = maxCombo;

        let rank = "C", color = "#5c7080";
        const border = (diffSetting.name === 'HARD') ? 50000 : (diffSetting.name === 'NORMAL' ? 30000 : 15000);
        
        if (score >= border) { rank = "S"; color = "#ffd700"; }
        else if (score >= border * 0.7) { rank = "A"; color = "#fff"; }
        else if (score >= border * 0.4) { rank = "B"; color = "#00d4ff"; }
        
        const rankEl = document.getElementById('rank');
        rankEl.innerText = rank;
        rankEl.style.color = color;
    }

    function updateUI() {
        scoreEl.innerText = `SCORE: ${score.toString().padStart(5, '0')}`;
        comboEl.innerText = combo > 0 ? combo : "";
    }

    function showMessage(txt, color) {
        messageEl.innerText = txt; messageEl.style.color = color;
        setTimeout(() => { if(messageEl.innerText === txt) messageEl.innerText = ""; }, 500);
    }

    window.addEventListener('keydown', (e) => {
        const idx = laneKeys.indexOf(e.key.toLowerCase());
        if (idx !== -1 && !isPressing[idx]) handleStart(idx);
    });
    window.addEventListener('keyup', (e) => {
        const idx = laneKeys.indexOf(e.key.toLowerCase());
        if (idx !== -1) handleEnd(idx);
    });
</script>

</body>
</html>
